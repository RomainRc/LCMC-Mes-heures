name: Fabriquer APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Preparer les fichiers
        run: |
          mkdir -p www/assets
          cp app.js index.html manifest.webmanifest styles.css sw.js theme-v2.css www/
          cp farm-banner-tablet.jpg farm-header-mobile.jpg www/assets/

      - name: Installer Capacitor
        run: npm install

      - name: Creer Android
        run: npx cap add android

      - name: Synchroniser
        run: npx cap sync android

      - name: Fabriquer APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: LCMC-Mes-Heures-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
